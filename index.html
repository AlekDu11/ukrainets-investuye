  var q = new URLSearchParams(location.search), o = new URLSearchParams();
  var map = { P: 'p', pmt: 'm', t: 'y', r: 'r' };
  Object.keys(map).forEach(function (k) { if (q.get(k) !== null && q.get(k) !== '') o.set(map[k], q.get(k)); });
  if (o.has('r')) o.set('i', 'custom');
  var n = { '1': 'y', '2': 'h', '4': 'q', '12': 'm' }[q.get('n')]; if (n) o.set('c', n);
  o.set('utm_source', 'mytimebox'); o.set('utm_medium', 'redirect');
  location.replace('https://whatifstack.com/compound-interest/?' + o.toString());
})();
</script>
